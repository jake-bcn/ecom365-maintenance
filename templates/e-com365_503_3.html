    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

        <title>e-Com365</title>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+SC&display=swap" rel="stylesheet">
        <style>
            body, p {
                margin: 0;
                padding: 0;
                font-family: 'Noto Sans', 'Noto Sans SC', sans-serif;
            }
            .root {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 50vh; /* 确保整个视口高度居中 */
            }
            .main_panel {
                width: 100%; /* 设置最大宽度为700px */
                max-width: 700px;
                padding: 16px;
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .main_icon {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
                font-size: 42px;
                font-weight: 700;
            }
            /* .main_icon img {
                width: 56px; 
            } */
            .main_pic {
                margin-top: 32px;
            }
            .main_pic img {
                width: 364px;
                height: 450px;
            }
            .main_header {
                margin-top: 40px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .main_header p {
                font-weight: 700;
                font-size: 32px;
                letter-spacing: 0%;
                text-align: center;
                color: #222222;
            }
            .main_description {
                margin-top: 24px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .main_description p {
                font-weight: 400;
                font-size: 24px;
                letter-spacing: 0px;
                text-align: center;
                color: rgba(0,0,0,0.9);
            }

            /* 模拟媒体查询的 narrow 模式 */
            /* body.narrow .main_icon svg { 
                width: 129px;
                height: 26px;
            } */
            body.narrow .main_pic { margin-top: 40px; }
            body.narrow .main_pic img { width: 162px; height: 200px; }
            body.narrow .main_header p { font-size: 28px; color: rgba(0,0,0,0.87); }
            body.narrow .main_description { margin-top: 16px; }
            body.narrow .main_description p { font-size: 16px; line-height: 24px; }

            /* 底部版权信息样式 */
            .footer {
                margin-top: 40px;
                text-align: center;
                font-size: 12px; /* 设置字号为12px */
                color: #666;
                position: absolute;
                bottom: 50px;
            }
            .footer a {
                color: #666;
            }
        </style>
    </head>

        <script type="text/javascript">
            function checkWidth() {
                if (window.innerWidth <= 768) {
                    document.body.classList.add('narrow');
                } else {
                    document.body.classList.remove('narrow');
                }
            }
            window.addEventListener('resize', checkWidth);
            checkWidth(); // 初次执行
        </script>
